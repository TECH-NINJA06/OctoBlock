[package]
name = "octoblock-fs"
description = "OctoBlock's pure copy-on-write file-system core: OBF1 format, B+trees, allocator, op log, fsck, and differential model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
