[package]
name = "octoblock-wb"
description = "OctoBlock Layer 4 write-back engine: path-class policy, op coalescing/elision, encrypted local journal, group commit, and crash recovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
fastrand = "2.5.0"
getrandom = "0.3.4"
octoblock-fs = { path = "../octoblock-fs" }
octopage-git = { path = "../octopage-git" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"
zeroize = "1.9.0"

[dev-dependencies]
octopage-testkit = { path = "../octopage-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }